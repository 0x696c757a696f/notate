name: CI

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The APK is built in its own job so a red test run still produces a
  # downloadable build; the test job keeps the workflow red on failures.
  apk:
    name: arm64-v8a debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        # Open-source actions/cache backend (v6 defaults to a commercial one).
        cache-provider: basic

    # ABI is pinned to arm64-v8a in app/build.gradle.kts (defaultConfig.ndk.abiFilters).
    - name: Build arm64-v8a Debug APK
      run: ./gradlew assembleDebug

    - name: Verify APK only ships arm64-v8a native code
      run: |
        apk=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
        abis=$(unzip -Z1 "$apk" 'lib/*' 2>/dev/null | cut -d/ -f2 | sort -u || true)
        echo "Native ABIs in $apk: ${abis:-<none>}"
        if [ -n "$abis" ] && [ "$abis" != "arm64-v8a" ]; then
          echo "::error::APK contains non-arm64-v8a native libraries"
          exit 1
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v7
      with:
        name: notate-debug-arm64-v8a-${{ github.sha }}
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        # Open-source actions/cache backend (v6 defaults to a commercial one).
        cache-provider: basic

    - name: Run Tests with Coverage
      run: ./gradlew jacocoTestReport --info

    - name: Upload Test Reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: |
          app/build/reports/tests/
          app/build/outputs/snapshots/

    - name: Add Coverage PR Comment
      uses: Madrapps/jacoco-report@v1.8
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      with:
        paths: |
          ${{ github.workspace }}/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 0
        min-coverage-changed-files: 0
        title: Code Coverage Report
        update-comment: true
