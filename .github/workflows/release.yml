name: Build & Release APK

# Push a tag like v1.2.0 to publish a GitHub Release with the signed
# arm64-v8a APK attached and auto-generated release notes. Tags containing a
# '-' (v1.2.0-beta.1) are published as pre-releases.
#
# Signing: if the KEYSTORE_BASE64 / KEY_ALIAS / STORE_PASSWORD / KEY_PASSWORD
# secrets are set, the APK is signed with that release key; otherwise it falls
# back to the shared debug key committed in app/debug.keystore.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    types: [labeled, synchronize] # 'synchronize' triggers on new commits

jobs:
  build:
    # Runs if it's a tag push OR if the PR currently has the 'build-apk' label applied
    # for a same-repository PR where signing secrets and PR write permissions are available
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'build-apk'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # Required to post the comment in the PR history

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # release notes need the previous tag

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        # Open-source actions/cache backend (v6 defaults to a commercial one).
        cache-provider: basic

    # Decode the Keystore from Secrets (skipped when the secrets are not configured)
    - name: Decode Keystore
      id: keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::warning::Release signing secrets are not set; signing with the shared debug key."
          echo "key=debug" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

        # Create keystore.properties
        {
          echo "storeFile=../release.keystore"
          echo "keyAlias=$KEY_ALIAS"
          echo "storePassword=$STORE_PASSWORD"
          echo "keyPassword=$KEY_PASSWORD"
        } > keystore.properties
        echo "key=release" >> "$GITHUB_OUTPUT"

    - name: Determine version
      id: version
      run: |
        # Same scheme as ci.yml: minutes since 2026-01-01 UTC, always increasing.
        echo "code=$(( ($(date -u +%s) - 1767225600) / 60 ))" >> "$GITHUB_OUTPUT"
        if [ "${{ github.event_name }}" = "push" ]; then
          name="${GITHUB_REF_NAME#v}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "filename=notate-${GITHUB_REF_NAME}-arm64-v8a.apk" >> "$GITHUB_OUTPUT"
          case "$name" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
        else
          echo "name=1.0-pr.${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "filename=notate-pr-${{ github.event.pull_request.number }}-arm64-v8a.apk" >> "$GITHUB_OUTPUT"
        fi

    - name: Show resolved R8 version (temporary)
      run: ./gradlew -q buildEnvironment | grep "com.android.tools:r8" || true

    - name: Build Release APK
      run: ./gradlew assembleRelease -Pnotate.versionCode=${{ steps.version.outputs.code }} -Pnotate.versionName=${{ steps.version.outputs.name }}

    - name: Rename APK
      run: |
        apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
        mv "$apk" ${{ steps.version.outputs.filename }}
        sha256sum ${{ steps.version.outputs.filename }} > ${{ steps.version.outputs.filename }}.sha256

    # ---------------------------------------------------------
    # PATH A: TAG PUSH -> Create GitHub Release
    # ---------------------------------------------------------
    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ steps.version.outputs.filename }}
          ${{ steps.version.outputs.filename }}.sha256
        draft: false
        prerelease: ${{ steps.version.outputs.prerelease }}
        generate_release_notes: true
        body: |
          arm64-v8a APK, versionName `${{ steps.version.outputs.name }}`, versionCode `${{ steps.version.outputs.code }}`.
          Signed with the **${{ steps.keystore.outputs.key }}** key.

    # ---------------------------------------------------------
    # PATH B: PULL REQUEST -> Upload Artifact & Comment
    # ---------------------------------------------------------
    - name: Upload APK as Artifact
      if: github.event_name == 'pull_request'
      id: upload-artifact
      uses: actions/upload-artifact@v7
      with:
        name: PR-Release-APK-${{ github.event.pull_request.number }}
        path: ${{ steps.version.outputs.filename }}
        retention-days: 7

    - name: Comment on PR with Artifact Link
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v9
      env:
        ARTIFACT_URL: ${{ steps.upload-artifact.outputs.artifact-url }}
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `✅ **APK Build Successful!**\n\nAn admin triggered a release build for this PR. You can download the generated APK here: [Download APK](${process.env.ARTIFACT_URL})`
          })
