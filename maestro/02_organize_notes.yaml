appId: com.alexdremov.notate
---
- launchApp:
    clearState: true
# A fresh install opens the default "My Notes" project; go back to the project list
- pressKey: back
- tapOn: "Add Project"
- inputText: "Local Notes"
# "This device" is the default location: no system file picker, the project opens right away
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Project: Local Notes"
    timeout: 5000
# Create a folder
- tapOn: "New Folder"
- inputText: "Work"
- tapOn: "Create"
- assertVisible: "Work"
# Enter folder and create a note
- tapOn: "Work"
- tapOn: "New Canvas"
- inputText: "My Note"
- tapOn: "Create"
- extendedWaitUntil:
    visible:
      id: ".*minimapView.*"
    timeout: 5000
# Verify back navigation returns to the correct breadcrumb
- pressKey: back
- assertVisible: "Work"
